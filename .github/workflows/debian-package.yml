name: Tres Debian package

on:
  push:
    branches: [main]
    paths:
      - "debian/**"
      - "packaging/deb/**"
      - "src/**"
      - "scripts/tres-session.sh"
      - ".github/workflows/debian-package.yml"
  pull_request:
    paths:
      - "debian/**"
      - "packaging/deb/**"
      - "src/**"
      - "scripts/tres-session.sh"
      - ".github/workflows/debian-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python dpkg-dev lintian python3

      - name: Create upstream source tarball for source-package review
        run: |
          srcdir="${GITHUB_REPOSITORY#*/}"
          cd ..
          tar --exclude-vcs --exclude="$srcdir/debian" \
            --transform="s|^$srcdir|tres-0.5.0|" \
            -czf tres_0.5.0.orig.tar.gz "$srcdir"

      - name: Build installable binary package
        run: dpkg-buildpackage --build=binary --no-sign

      - name: Inspect package contents and metadata
        run: |
          dpkg-deb --info ../tres_*_all.deb
          dpkg-deb --contents ../tres_*_all.deb
          sha256sum ../tres_*_all.deb
          mkdir -p "$RUNNER_TEMP/tres-package-check"
          dpkg-deb --extract ../tres_*_all.deb "$RUNNER_TEMP/tres-package-check"
          test -x "$RUNNER_TEMP/tres-package-check/usr/bin/tres-config"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/menu.xml"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_layout.py"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_config.py"
          test -x "$RUNNER_TEMP/tres-package-check/usr/bin/tres-screenshot"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_capture.py"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_screenshot.py"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/applications/tres-screenshot.desktop"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_preferences.py"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_display.py"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_shortcuts.py"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_open.py"
          test -f "$RUNNER_TEMP/tres-package-check/usr/share/tres/tres_wallpaper.py"
          test -x "$RUNNER_TEMP/tres-package-check/usr/bin/tres-open-files"
          test -x "$RUNNER_TEMP/tres-package-check/usr/bin/tres-wallpaper"

      - name: Run lintian review (report findings, do not mask build errors)
        run: |
          lintian ../tres_*_all.deb | tee ../lintian-report.txt || true

      - name: Build unsigned source package for review
        run: dpkg-buildpackage --build=source --no-sign

      - name: Stage package artifacts inside the workspace
        run: |
          mkdir -p dist
          cp ../tres_*.deb ../tres_*.dsc \
            ../tres_*.debian.tar.* ../tres_*.orig.tar.* \
            ../tres_*.changes ../lintian-report.txt dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tres-debian-packages
          path: dist/
          if-no-files-found: error
