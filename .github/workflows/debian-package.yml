name: Debian package

on:
  push:
    branches: [main]
    paths:
      - "debian/**"
      - "packaging/deb/**"
      - "src/**"
      - "scripts/tres-session.sh"
      - ".github/workflows/debian-package.yml"
  pull_request:
    paths:
      - "debian/**"
      - "packaging/deb/**"
      - "src/**"
      - "scripts/tres-session.sh"
      - ".github/workflows/debian-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python dpkg-dev lintian python3

      - name: Create upstream source tarball for source-package review
        run: |
          cd ..
          tar --exclude='tres-labwc/.git' --exclude='tres-labwc/debian' \
            -czf tres-labwc_0.1.0.orig.tar.gz tres-labwc

      - name: Build installable binary package
        run: dpkg-buildpackage --build=binary --no-sign

      - name: Inspect package contents and metadata
        run: |
          dpkg-deb --info ../tres-labwc_*_all.deb
          dpkg-deb --contents ../tres-labwc_*_all.deb
          sha256sum ../tres-labwc_*_all.deb

      - name: Run lintian review (report findings, do not mask build errors)
        run: |
          lintian ../tres-labwc_*_all.deb | tee ../lintian-report.txt || true

      - name: Build unsigned source package for review
        run: dpkg-buildpackage --build=source --no-sign

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tres-labwc-debian-packages
          path: |
            ../tres-labwc_*.deb
            ../tres-labwc_*.dsc
            ../tres-labwc_*.debian.tar.*
            ../tres-labwc_*.orig.tar.*
            ../tres-labwc_*.changes
            ../lintian-report.txt
          if-no-files-found: error
