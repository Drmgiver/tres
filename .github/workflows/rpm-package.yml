name: Experimental RPM package
on:
  push:
    paths:
      - 'packaging/rpm/**'
      - 'src/**'
      - 'scripts/**'
      - 'packaging/deb/**'
      - 'tests/**'
      - '.github/workflows/rpm-package.yml'
  pull_request:
    paths:
      - 'packaging/rpm/**'
      - 'src/**'
      - 'scripts/**'
      - 'packaging/deb/**'
      - 'tests/**'
      - '.github/workflows/rpm-package.yml'

jobs:
  rpm-fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install packaging tools
        run: dnf -y install git rpm-build python3 tar xz findutils desktop-file-utils
      - uses: actions/checkout@v4
      - name: Check session bootstrap syntax
        run: sh -n packaging/rpm/tres-session
      - name: Validate desktop entry
        run: desktop-file-validate packaging/deb/tres-screenshot.desktop
      - name: Build RPM from current checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tres-rpm/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          git -c safe.directory="$PWD" archive --format=tar --prefix=tres-1.0.1/ HEAD | xz -c > /tmp/tres-rpm/SOURCES/tres-1.0.1.tar.xz
          rpmbuild -bb packaging/rpm/tres.spec --define '_topdir /tmp/tres-rpm'
          find /tmp/tres-rpm/RPMS -type f -name 'tres-*.rpm' -print -exec rpm -qpl {} \;
      - name: Install RPM with Fedora dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          rpm_file=$(find /tmp/tres-rpm/RPMS -type f -name 'tres-*.rpm' -print -quit)
          test -n "$rpm_file"
          dnf -y install "$rpm_file"
          test -x /usr/bin/tres-session
          test -f /usr/share/wayland-sessions/tres.desktop
          python3 - <<'PY'
          import gi
          gi.require_version("Gdk", "3.0")
          gi.require_version("Gtk", "3.0")
          gi.require_version("GtkLayerShell", "0.1")
          from gi.repository import Gdk, Gtk, GtkLayerShell
          print("Tres GTK3 and layer-shell introspection bindings available")
          PY

  rpm-opensuse:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      - name: Install openSUSE packaging and lint tools
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install git rpm-build python3 tar xz rpmlint desktop-file-utils findutils
      - uses: actions/checkout@v4
      - name: Validate desktop entry
        run: desktop-file-validate packaging/deb/tres-screenshot.desktop
      - name: Build and lint native openSUSE RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tres-rpm/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          git -c safe.directory="$PWD" archive --format=tar --prefix=tres-1.0.1/ HEAD | xz -c > /tmp/tres-rpm/SOURCES/tres-1.0.1.tar.xz
          rpmbuild -bb packaging/rpm/tres.spec --define '_topdir /tmp/tres-rpm'
          rpm_file=$(find /tmp/tres-rpm/RPMS -type f -name 'tres-*.rpm' -print -quit)
          test -n "$rpm_file"
          rpmlint "$rpm_file"
      - name: Install RPM with openSUSE dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          rpm_file=$(find /tmp/tres-rpm/RPMS -type f -name 'tres-*.rpm' -print -quit)
          test -n "$rpm_file"
          zypper --non-interactive --no-recommends install "$rpm_file"
          test -x /usr/bin/tres-session
          test -f /usr/share/wayland-sessions/tres.desktop
          python3 - <<'PY'
          import gi
          gi.require_version("Gdk", "3.0")
          gi.require_version("Gtk", "3.0")
          gi.require_version("GtkLayerShell", "0.1")
          from gi.repository import Gdk, Gtk, GtkLayerShell
          print("Tres GTK3 and layer-shell introspection bindings available")
          PY
